<!doctype html>
<meta charset="utf-8">
<title>node-gym — browser (QuickJS + native rasterizer)</title>
<style>
  body { font: 14px system-ui, sans-serif; background: #111; color: #ddd; display: flex;
         flex-direction: column; align-items: center; gap: 12px; padding: 20px; }
  canvas { border: 1px solid #333; background: #000; }
  .row { display: flex; gap: 10px; align-items: center; }
  select, button { font: inherit; padding: 4px 8px; background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; }
  .hint { color: #888; }
</style>

<h2>node-gym in the browser</h2>
<p class="hint">Same QuickJS + native rasterizer + frozen fdlibm as training — you see the exact bytes agents see. Arrow keys move, Space = action.</p>
<div class="row">
  <label>Game <select id="game"></select></label>
  <button id="reset">Reset</button>
  <span id="status" class="hint"></span>
</div>
<canvas id="screen" width="64" height="64"></canvas>
<div class="row hint"><span id="info"></span></div>

<script type="module">
import factory from '../build/qjs_browser.mjs';

const GAMES = ['bigfish', 'pong', 'asteroids', 'space_invaders', 'breakout', 'freeway'];
const gameSel = document.getElementById('game');
GAMES.forEach(g => { const o = document.createElement('option'); o.value = o.textContent = g; gameSel.appendChild(o); });

const M = await factory();
const qb_init = M.cwrap('qb_init', 'number', ['string']);
const qb_reset = M.cwrap('qb_reset', null, ['number']);
const qb_step = M.cwrap('qb_step', null, ['number']);
const qb_pixels = M.cwrap('qb_pixels', 'number', []);
const qb_width = M.cwrap('qb_width', 'number', []);
const qb_height = M.cwrap('qb_height', 'number', []);

const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, img = null;
const status = document.getElementById('status');
const info = document.getElementById('info');
function sizeCanvas() {  // render at the game's native resolution
  W = qb_width(); H = qb_height();
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  img = ctx.createImageData(W, H);
}

// keyboard -> keymask bits: 1=L 2=R 4=U 8=D 16=Space
const held = new Set();
const KEYBIT = { ArrowLeft: 1, ArrowRight: 2, ArrowUp: 4, ArrowDown: 8, ' ': 16 };
addEventListener('keydown', e => { if (e.key in KEYBIT) { held.add(e.key); e.preventDefault(); } });
addEventListener('keyup', e => { if (e.key in KEYBIT) { held.delete(e.key); e.preventDefault(); } });
function keymask() { let m = 0; for (const k of held) m |= KEYBIT[k]; return m; }

let running = false, frames = 0, acc = 0, last = 0;
const HZ = 60, DT = 1000 / HZ;               // games are authored for 60 fps
async function loadGame(name) {
  const src = await (await fetch(`../../examples/games/js/${name}.js`)).text();
  const rc = qb_init(src);
  status.textContent = rc === 0 ? `loaded ${name} (${qb_width()}×${qb_height()})` : `init error ${rc}`;
  qb_reset((Math.random() * 2 ** 31) | 0);
  sizeCanvas();
  frames = 0; acc = 0; last = performance.now();
  if (!running) { running = true; requestAnimationFrame(loop); }
}
function draw() {
  const n = W * H * 3, p = qb_pixels();
  const buf = M.HEAPU8.subarray(p, p + n);
  for (let i = 0, d = 0, s = 0; i < W * H; i++, d += 4, s += 3) {
    img.data[d] = buf[s]; img.data[d + 1] = buf[s + 1]; img.data[d + 2] = buf[s + 2]; img.data[d + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}
// Fixed 60 fps timestep: step exactly HZ times/sec regardless of the display's
// refresh rate (so 120/144 Hz monitors don't run the game 2-2.4x too fast).
function loop(now) {
  acc += now - last; last = now;
  let steps = 0;
  while (acc >= DT && steps < 4) { qb_step(keymask()); acc -= DT; steps++; frames++; }
  if (steps) { draw(); info.textContent = `frame ${frames} · ${W}×${H} · 60fps`; }
  requestAnimationFrame(loop);
}
document.getElementById('reset').onclick = () => { qb_reset((Math.random() * 2 ** 31) | 0); frames = 0; };
gameSel.onchange = () => loadGame(gameSel.value);
await loadGame(GAMES[0]);
</script>
