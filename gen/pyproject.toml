[project]
name = "gym-gen"
version = "0.1.0"
description = "LLM-driven generation and natural-language modification of p5.js RL environments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.72.0",
  "numpy>=2.2.0",
  "node-gym",
]

[project.optional-dependencies]
# Closed-loop refinement against the real Atari ROMs (tools/refine_vs_rom.py).
rom = [
  "ale-py>=0.10",
  "autorom>=0.6",
  "gymnasium>=1.0",
  "pillow>=10",
]

[tool.uv.sources]
# node-gym lives in a sibling repo. Clone both side-by-side:
#   <parent>/gym-gen          (this repo)
#   <parent>/node-gym         (https://github.com/heyodog0/node-gym)
node-gym = { path = "../node-gym", editable = true }

[project.scripts]
gym-gen-validate = "gym_gen.validate.validate:main"
gym-gen-bench    = "gym_gen.validate.bench:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gym_gen"]
