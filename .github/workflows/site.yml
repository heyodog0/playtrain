name: site
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "tools/build-pages.mjs"
      - "tools/play-templates.mjs"
      - "runtime/p5/**"
      - "examples/games/js/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@v5
      - run: bash website/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
