[project]
name = "playtrain"
version = "0.1.0"
description = "PlayTrain: LLM-generated 2D game environments + a headless RL runtime for Gymnasium."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Ryan Truong" },
]
keywords = ["reinforcement-learning", "gymnasium", "rl", "headless", "p5", "llm", "procgen", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime only. The LLM generation pipeline (playtrain.gen) needs more; it is
# the `gen` extra, so stepping an environment never pulls a model SDK.
dependencies = [
  "gymnasium>=1.0",
  "numpy>=2.2.0",
]

[project.optional-dependencies]
# The generation / refinement pipeline (playtrain.gen).
gen = [
  "google-genai>=1.72.0",
  "httpx>=0.27",
]
test = [
  "pytest>=8.0",
]
# Closed-loop refinement against the real Atari ROMs (tools/refine_vs_rom.py).
rom = [
  "ale-py>=0.10",
  "autorom>=0.6",
  "gymnasium>=1.0",
  "pillow>=10",
]

[project.scripts]
# One entry point so `uvx playtrain <cmd>` works with nothing installed.
playtrain           = "playtrain.cli:main"
playtrain-validate = "playtrain.gen.validate.validate:main"
playtrain-bench    = "playtrain.gen.validate.bench:main"
playtrain-generate = "playtrain.gen.generate:main"
playtrain-variant  = "playtrain.gen.variant:main"
playtrain-refine   = "playtrain.gen.refine:main"

[project.urls]
Homepage = "https://github.com/heyodog0/playtrain"
Repository = "https://github.com/heyodog0/playtrain"
Issues = "https://github.com/heyodog0/playtrain/issues"

[build-system]
requires = ["hatchling", "packaging"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playtrain"]
artifacts = ["src/playtrain/_assets/native/build/*"]

# The native backend is built by hatch_build.py and staged under _assets.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"runtime" = "playtrain/_assets/runtime"
"examples/games" = "playtrain/_assets/examples/games"
"GAME_TEMPLATE.md" = "playtrain/_assets/GAME_TEMPLATE.md"
# Notices for the components statically linked into the bundled native backend.
"THIRD_PARTY_LICENSES.md" = "playtrain/_assets/THIRD_PARTY_LICENSES.md"

[tool.hatch.build.targets.sdist]
include = [
  "src/playtrain",
  "hatch_build.py",
  "native",
  "crates",
  "runtime",
  "examples/games",
  "games",
  "GAME_TEMPLATE.md",
  "README.md",
  "LICENSE",
]
