[project]
name = "playtrain"
version = "0.1.0"
description = "PlayTrain: LLM-generated 2D game environments + a headless RL runtime for Gymnasium."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Ryan Truong" },
]
keywords = ["reinforcement-learning", "gymnasium", "rl", "headless", "p5", "llm", "procgen", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "gymnasium>=1.0",
  "numpy>=2.2.0",
  "google-genai>=1.72.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]
# Closed-loop refinement against the real Atari ROMs (tools/refine_vs_rom.py).
rom = [
  "ale-py>=0.10",
  "autorom>=0.6",
  "gymnasium>=1.0",
  "pillow>=10",
]

[project.scripts]
playtrain-validate = "playtrain.gen.validate.validate:main"
playtrain-bench    = "playtrain.gen.validate.bench:main"
playtrain-generate = "playtrain.gen.generate:main"
playtrain-variant  = "playtrain.gen.variant:main"
playtrain-refine   = "playtrain.gen.refine:main"

[project.urls]
Homepage = "https://github.com/heyodog0/playtrain"
Repository = "https://github.com/heyodog0/playtrain"
Issues = "https://github.com/heyodog0/playtrain/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playtrain"]

[tool.hatch.build.targets.sdist]
include = [
  "src/playtrain",
  "runtime",
  "examples/games",
  "games",
  "GAME_TEMPLATE.md",
  "README.md",
  "docs",
  "LICENSE",
]
