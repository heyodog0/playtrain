[project]
name = "fast-llm-games"
version = "0.0.1"
description = "Minimal Gymnasium wrapper and PPO training script for the Kazuki browser game"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.72.0",
  "gymnasium>=1.1.1",
  "numpy>=2.2.0",
  "stable-baselines3>=2.7.0",
]

[project.optional-dependencies]
notebook = [
  "marimo>=0.13.0",
  "matplotlib>=3.9.0",
]
experiment = [
  "wandb>=0.18.0",
  "tensorboard>=2.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fast_llm_games"]
