[package]
name = "node-gym-rasterizer"
version = "0.1.0"
edition = "2021"
description = "Tiny 2D rasterizer for the node-gym p5 shim primitive surface. Compiles to wasm32 (in-process, no system deps) and native. Port of runtime/p5/raster.mjs; differential-tested against it."

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
